// Diagnostic init script: dump what the LSP ModuleSourceSetsModelBuilder would see
// Writes directly to a file (daemon stdout is unreliable under redirect).
def out = new File("F:/PROJEKTY/ThingSpeak Monitor Widget APK/diag-result.txt")
out.text = "INIT SCRIPT APPLIED\n"

gradle.beforeProject { p ->
    p.plugins.withId("com.android.application") {
        out.append("APP_PLUGIN applied on ${p.path}\n")
        try {
            def ac = p.extensions.findByName("androidComponents")
            out.append("  androidComponents=${ac != null}\n")
            if (ac != null) {
                def cls = ac.class
                def mSelector = cls.methods.find { it.name == "selector" && it.parameterCount == 0 }
                out.append("  selector() method=${mSelector}\n")
                def selector = mSelector?.invoke(ac)
                def mAll = selector?.class?.methods?.find { it.name == "all" && it.parameterCount == 0 }
                out.append("  selector().all() method=${mAll}\n")
                def allSelector = mAll?.invoke(selector)
                // ---- Exact replication of LSP Reflected.call + resolveMethod ----
                def action = new org.gradle.api.Action<Object>() { void execute(Object v) { out.append("    LSP-STYLE CB variant=${v}\n") } }
                def params = [allSelector.class, action.class] as Class[]
                def found = null
                try {
                    found = cls.getMethod("onVariants", params)
                    out.append("  fast-path getMethod FOUND: ${found}\n")
                } catch (NoSuchMethodException e) {
                    out.append("  fast-path getMethod NOT FOUND\n")
                }
                if (found == null) {
                    def cands = cls.methods.findAll { it.name == "onVariants" && it.parameterCount == 2 }
                    out.append("  slow-path candidates (${cands.size()}):\n")
                    cands.each { c -> out.append("    ${c}\n") }
                    found = cands.find { m ->
                        def ok = true
                        for (i in 0..<2) {
                            if (!m.parameterTypes[i].isAssignableFrom(params[i])) { ok = false; break }
                        }
                        ok
                    }
                    out.append("  slow-path result: ${found}\n")
                }
                if (found != null) {
                    try {
                        def res = found.invoke(ac, allSelector, action)
                        out.append("  invoke via resolveMethod OK -> ${res}\n")
                    } catch (Throwable t) {
                        out.append("  invoke via resolveMethod FAIL ${t.cause ?: t}\n")
                    }
                }
            }
        } catch (Throwable t) {
            out.append("  PROBE FAILED: ${t.class.name}: ${t.message}\n")
        }
    }
}

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { p ->
        def ssc = p.extensions.findByType(org.gradle.api.tasks.SourceSetContainer.class)
        def androidComp = p.extensions.findByName("androidComponents")
        def kspExt = p.extensions.findByName("ksp")
        out.append("DIAG project=${p.path} SourceSetContainer=${ssc != null} count=${ssc ? ssc.size() : 0} androidComponents=${androidComp != null} ksp=${kspExt != null}\n")
        ssc?.each { ss ->
            out.append("DIAG   ss=${ss.name} srcDirs=${ss.allSource.srcDirs}\n")
        }
    }
    out.append("DONE\n")
}
